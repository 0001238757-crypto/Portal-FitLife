<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitLife - Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="caixa-login"> 
        <h1>FITLIFE</h1> 
        <h2>Treine. Evolua. Supere.</h2>

        <form id="form-login">

            <label for="email">
                Email
            </label>
            <input type="email"
            id="email"
            placeholder="Digite seu E-mail"
            required
            >

            <label for="senha"> 
                Senha
            </label>
            <input type="password"
            id="senha"
            placeholder="Digite sua senha"
            required
            >

            <button type="submit">
                Entrar
            </button>

            <p id="mensagem-erro"></p>


        </form>

    </div>


    <script src="script.js"></script>
</body>

</html>
